# Glance for TOS -- portal route.
#
# TOS includes the *.conf files of this directory inside the main server
# block, so only location entries are allowed here; do not add a server block.
#
# The app center normally deploys nginx/<appid>.conf, but a manual dpkg
# install does not, which shows up as the service running while /glance/
# returns 404. postinst copies this file to /etc/nginx/conf.d/glance.conf.
#
# ^~ keeps a later regex location from taking the request away from the app.

location = /glance {
    absolute_redirect off;
    return 302 /glance/;
}

location ^~ /glance/ {
    alias /usr/local/glance/webui/;
    index index.html;
    add_header Cache-Control "no-store";
}
