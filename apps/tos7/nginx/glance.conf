# Glance for TOS -- portal route.
#
# TOS includes the *.conf files of this directory inside the main server
# block, so only location entries are allowed here; do not add a server block.
#
# Glance runs in "proxied" mode: it listens on 127.0.0.1:18741, generates its
# asset URLs with base-url /glance, and expects the reverse proxy to strip that
# prefix. The trailing slash on proxy_pass does exactly that.
#
# The previous revision served a static webui whose iframe loaded
# /v2/proxy/glance/. TOS answers a document navigation to /v2/proxy/<appid>/
# with HTTP 403 because the navigation cannot carry the platform CSRF header,
# which produced a blank window. Serving the dashboard directly avoids it.
#
# postinst copies this file to /etc/nginx/conf.d/glance.conf.

location = /glance {
    absolute_redirect off;
    return 302 /glance/;
}

location ^~ /glance/ {
    proxy_pass http://127.0.0.1:18741/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
